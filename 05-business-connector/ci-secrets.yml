# Episode 5 · secret scanner on GitHub (deterministic, no model). Copy to .github/workflows/secrets.yml.
# Same rules as the pre-commit hook (.gitleaks.toml at the repo root). A finding fails the job (gitleaks exit 1).
# Pinned binary + checksum check, no third-party action and no licence key needed.
name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: a key that was committed and then deleted is still a leak

      - name: Install gitleaks (pinned, checksum verified)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/${tarball}"
          curl -sSfLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
          ./gitleaks version

      - name: Scan git history
        run: ./gitleaks git --config .gitleaks.toml --redact --verbose --exit-code 1 .
